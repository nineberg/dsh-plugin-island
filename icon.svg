<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Plugin Island icon: a dark floating island pill with a puzzle-piece
       dock slot and three docked dots. Original artwork for @local/plugin-island. -->
  <defs>
    <linearGradient id="pli-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a38"/>
      <stop offset="1" stop-color="#3d475c"/>
    </linearGradient>
  </defs>
  <rect x="3" y="19" width="58" height="26" rx="13" fill="url(#pli-g)"/>
  <!-- puzzle piece peeking out of the island -->
  <path d="M24 25h5.2v-2.3a2.7 2.7 0 1 1 5.4 0V25H40v5.6h2.3a2.7 2.7 0 1 1 0 5.4H40V42h-5.6v2.3a2.7 2.7 0 1 1-5.4 0V42H24v-5.6h-2.3a2.7 2.7 0 1 1 0-5.4H24z"
        fill="#e9edf5"/>
  <!-- docked plugin dots -->
  <circle cx="47.5" cy="28.5" r="2.2" fill="#8fd3ff"/>
  <circle cx="47.5" cy="35.5" r="2.2" fill="#9ee6c1"/>
  <circle cx="47.5" cy="42.5" r="2.2" fill="#f5c96b"/>
  <!-- floating shadow -->
  <ellipse cx="32" cy="49.5" rx="22" ry="2.6" fill="#232a38" opacity="0.25"/>
</svg>
